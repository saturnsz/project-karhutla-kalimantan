<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Console Dashboard — Xbox/PS5 style gaming home screen with immersive artwork backgrounds and tile carousel navigation.">
  <title>Console Dashboard — My Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══ Background Hero (dual-layer crossfade) ═══ -->
  <div class="hero-bg-container" aria-hidden="true">
    <div class="hero-bg active" id="heroBg1"></div>
    <div class="hero-bg" id="heroBg2"></div>
    <div class="ambient-glow" id="ambientGlow"></div>
  </div>

  <!-- ═══ Floating Particles ═══ -->
  <div class="particles" aria-hidden="true" id="particles"></div>

  <!-- ═══ Top Bar ═══ -->
  <header class="topbar" id="topbar">
    <button class="section-label" id="sectionUp">
      <svg class="chev-icon up" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2 8 6 4 10 8"/></svg>
      <span>My Space</span>
    </button>
    <div class="topbar-right">
      <div class="user-badge">
        <div class="avatar-ring">
          <div class="avatar-placeholder">N</div>
        </div>
      </div>
      <time class="clock" id="clock"></time>
    </div>
  </header>

  <!-- ═══ Hero Info ═══ -->
  <section class="hero-info" id="heroInfo">
    <div class="game-tag" id="gameTag">TERAKHIR DIMAINKAN</div>
    <h1 class="game-title" id="gameTitle"></h1>
    <div class="game-meta">
      <div class="meta-group">
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-text" id="progressText"></span>
        </div>
        <span class="meta-divider">·</span>
        <span class="playtime" id="playtime">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="playtimeText"></span>
        </span>
      </div>
      <div class="meta-group">
        <span class="rewards" id="rewards">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 9 7 9 7h6s2-3 4.5-3a2.5 2.5 0 0 1 0 5H18"/><path d="M12 7v13"/><path d="M6 9h12l-1.5 10a2 2 0 0 1-2 1.5h-5A2 2 0 0 1 7.5 19Z"/></svg>
          <span id="rewardsText"></span>
        </span>
      </div>
    </div>
    <div class="hero-actions">
      <button class="btn-play" id="btnPlay">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Mainkan</span>
      </button>
      <button class="btn-secondary" id="btnDetails">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>Detail</span>
      </button>
    </div>
  </section>

  <!-- ═══ Tile Carousel ═══ -->
  <nav class="tile-section" id="tileSection">
    <div class="tile-row" id="tileRow" role="listbox" aria-label="Koleksi game"></div>
    <!-- Scroll indicators -->
    <div class="scroll-indicator left" id="scrollLeft" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="scroll-indicator right" id="scrollRight" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </nav>

  <!-- ═══ Bottom Bar ═══ -->
  <footer class="bottombar" id="bottombar">
    <button class="section-label" id="sectionDown">
      <svg class="chev-icon down" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2 4 6 8 10 4"/></svg>
      <span>What's New</span>
    </button>
    <div class="hints">
      <span class="hint">
        <kbd class="btn-hint y">Y</kbd>
        <span>Details</span>
      </span>
      <span class="hint">
        <kbd class="btn-hint a">A</kbd>
        <span>Play</span>
      </span>
      <span class="hint-divider"></span>
      <button class="icon-btn" aria-label="Voice search" id="btnVoice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Settings" id="btnSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- ═══ Toast / Notification ═══ -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="js/main.js"></script>
</body>
</html>
